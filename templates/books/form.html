{% extends "base.html" %}
{% block title %}{{ action }} Book{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="d-flex align-items-center mb-4 gap-3">
      <i class="bi bi-book-{{ 'fill' if action=='Create' else 'half' }} fs-2 text-success"></i>
      <div>
        <h1 class="h3 mb-0 fw-bold">{{ action }} Book</h1>
        <p class="text-muted mb-0 small">Fields marked * are required</p>
      </div>
    </div>

    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <form method="POST" novalidate>
          <div class="mb-3">
            <label class="form-label fw-semibold">Title *</label>
            <input type="text" name="title" class="form-control"
                   value="{{ book.title if book else '' }}"
                   placeholder="e.g. Python for Everyone" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Author *</label>
            <input type="text" name="author" class="form-control"
                   value="{{ book.author if book else '' }}"
                   placeholder="e.g. Jane Smith" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Price ($) *</label>
            <div class="input-group">
              <span class="input-group-text">$</span>
              <input type="number" name="price" class="form-control" step="0.01" min="0"
                     value="{{ book.price if book else '' }}"
                     placeholder="29.99" required>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Published Date</label>
            <input type="date" name="published_date" class="form-control"
                   value="{{ book.published_date if book else '' }}">
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Status *</label>
            <select name="status" class="form-select">
              <option value="available"   {% if not book or book.status=='available'   %}selected{% endif %}>Available</option>
              <option value="unavailable" {% if book and book.status=='unavailable' %}selected{% endif %}>Unavailable</option>
            </select>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success flex-fill">
              <i class="bi bi-check2-circle me-1"></i>{{ action }}
            </button>
            <a href="{{ url_for('books_list') }}" class="btn btn-outline-secondary flex-fill">
              <i class="bi bi-x-circle me-1"></i>Cancel
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
