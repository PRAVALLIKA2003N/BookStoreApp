{% extends "base.html" %}
{% block title %}{{ action }} User{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="d-flex align-items-center mb-4 gap-3">
      <i class="bi bi-person-{{ 'plus' if action=='Create' else 'gear' }}-fill fs-2 text-primary"></i>
      <div>
        <h1 class="h3 mb-0 fw-bold">{{ action }} User</h1>
        <p class="text-muted mb-0 small">All fields marked * are required</p>
      </div>
    </div>

    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <form method="POST" novalidate>
          <div class="mb-3">
            <label class="form-label fw-semibold">Full Name *</label>
            <input type="text" name="name" class="form-control"
                   value="{{ user.name if user else '' }}"
                   placeholder="e.g. Alice Johnson" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Email Address *</label>
            <input type="email" name="email" class="form-control"
                   value="{{ user.email if user else '' }}"
                   placeholder="alice@example.com" required>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Status *</label>
            <select name="status" class="form-select">
              <option value="active"   {% if user and user.status=='active'   %}selected{% endif %}>Active</option>
              <option value="inactive" {% if user and user.status=='inactive' %}selected{% endif %}>Inactive</option>
            </select>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary flex-fill">
              <i class="bi bi-check2-circle me-1"></i>{{ action }}
            </button>
            <a href="{{ url_for('users_list') }}" class="btn btn-outline-secondary flex-fill">
              <i class="bi bi-x-circle me-1"></i>Cancel
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
